<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Younes Training">
<meta name="theme-color" content="#000">
<title>Younes Training</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<iframe id="app" src="./sport-jeunesse.html" title="Programme sport de Younes"></iframe>
<script>
(function(){
  var frame=document.getElementById('app');
  frame.addEventListener('load',function(){
    try{
      var w=frame.contentWindow;
      var newA={
        name:'Upper Push + Bras',day:'Séance 1',type:'up',
        note:'Pectoraux, épaules et bras. Barre + haltères + poulie. Technique propre avant la charge.',
        exs:[
          {id:'dcb',name:'Développé couché barre',sets:4,reps:'8-10',tempo:'2-0-1-0',rest:"1'30",rir:'3',note:'Omoplates serrées, pieds ancrés au sol'},
          {id:'dih',name:'Développé incliné haltères',sets:3,reps:'10-12',tempo:'2-0-1-0',rest:"1'30",rir:'3',note:'Banc à 30-45° maximum'},
          {id:'deh',name:'Développé épaules haltères ou machine',sets:3,reps:'10-12',tempo:'2-0-1-0',rest:"1'30",rir:'3',note:'Haltères en priorité si la technique est propre'},
          {id:'ell',name:'Élévations latérales haltères',sets:3,reps:'12-15',tempo:'2-0-1-0',rest:"1'",rir:'2',note:'Charge légère, aucun élan'},
          {id:'cez',name:'Curl barre EZ ou haltères',sets:3,reps:'10-12',tempo:'2-0-1-0',rest:'-',rir:'2',grp:'g1',note:'Enchaîne directement avec les triceps'},
          {id:'ptc',name:'Pushdown triceps corde',sets:3,reps:'10-12',tempo:'2-0-1-1',rest:"1'",rir:'2',grp:'g1',note:'Repos après les deux exercices'}
        ]
      };
      if(w.DAYS) w.DAYS.A=newA;
      if(w.GRP) w.GRP.g1={t:'ss',l:'SUPERSET BICEPS + TRICEPS'};
      if(w.CUES){
        w.CUES.dcb={n:'Développé couché barre',c:['Pieds bien ancrés au sol','Omoplates serrées et poitrine sortie','Barre vers le bas des pectoraux','Coudes à environ 45°, pas à 90°']};
        w.CUES.deh={n:'Développé épaules haltères',c:['Dos gainé et poitrine haute','Haltères au niveau des oreilles en bas','Monte sans cogner les haltères','Ne cambre pas excessivement le bas du dos']};
        w.CUES.cez={n:'Curl barre EZ',c:['Coudes fixes le long du corps','Pas d élan avec le dos','Monte sans avancer les épaules','Descente lente et complète']};
      }
      if(w.S){
        var days=w.S.days();
        days.A=newA;
        w.S.setDays(days);
        var s=w.gSet?w.gSet():null;
        if(s){s.name='Younes';w.S.set('set',s);}
      }
      if(w.buildDayChips) w.buildDayChips();
      if(w.renderWorkout) w.renderWorkout('A');
      if(w.uHome) w.uHome();
      var t=w.document.querySelector('title'); if(t)t.textContent='Younes Training';
    }catch(e){console.error(e);}
  });
})();
</script>
</body>
</html>
